services:
  db:
    image: postgres:16-alpine
    container_name: splitvision-db
    environment:
      POSTGRES_USER: splitvision
      POSTGRES_PASSWORD: splitvision
      POSTGRES_DB: splitvision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitvision -d splitvision"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
